<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141d2f"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Header Bar -->
  <rect x="0" y="0" width="1280" height="64" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="40" cy="32" r="8" fill="#3b82f6"/>
  <text x="60" y="38" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="0.5">Handwritten Digit Classification — TensorFlow &amp; Keras</text>
  <rect x="1080" y="18" width="160" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="1100" cy="32" r="4" fill="#10b981"/>
  <text x="1114" y="37" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Model: ANN (MNIST)</text>

  <!-- Left Card: Interactive Canvas -->
  <rect x="50" y="94" width="360" height="576" rx="20" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="80" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Draw Input Digit</text>
  <text x="80" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Interactive 28x28 grayscale canvas</text>
  
  <rect x="80" y="190" width="300" height="300" rx="16" fill="#030712" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Digit '7' drawn with glowing brush -->
  <path d="M 120 250 L 320 250 L 220 440" fill="none" stroke="#60a5fa" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M 120 250 L 320 250 L 220 440" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Canvas Buttons -->
  <rect x="80" y="520" width="140" height="42" rx="21" fill="#2563eb"/>
  <text x="150" y="546" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Classify Digit</text>
  <rect x="240" y="520" width="140" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="310" y="546" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Clear Canvas</text>

  <!-- Center Card: Neural Network Architecture -->
  <rect x="430" y="94" width="450" height="576" rx="20" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="460" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">ANN Architecture &amp; Activations</text>
  <text x="460" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Dense(128, relu) → Dropout(0.2) → Dense(10, softmax)</text>
  
  <!-- Layer 1 Nodes (Input 784) -->
  <g fill="#38bdf8">
    <circle cx="500" cy="230" r="9"/>
    <circle cx="500" cy="270" r="9"/>
    <circle cx="500" cy="310" r="9"/>
    <circle cx="500" cy="350" r="9"/>
    <circle cx="500" cy="390" r="9"/>
    <circle cx="500" cy="430" r="9"/>
    <circle cx="500" cy="470" r="9"/>
  </g>
  <text x="500" y="510" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">784 Inputs</text>

  <!-- Layer 2 Nodes (Hidden 128) -->
  <g fill="#6366f1">
    <circle cx="650" cy="250" r="10"/>
    <circle cx="650" cy="295" r="10"/>
    <circle cx="650" cy="340" r="10"/>
    <circle cx="650" cy="385" r="10"/>
    <circle cx="650" cy="430" r="10"/>
    <circle cx="650" cy="475" r="10"/>
  </g>
  <text x="650" y="515" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Dense (ReLU)</text>

  <!-- Layer 3 Nodes (Output 10) -->
  <g fill="#10b981">
    <circle cx="800" cy="230" r="8" fill="#475569"/>
    <circle cx="800" cy="265" r="8" fill="#475569"/>
    <circle cx="800" cy="300" r="8" fill="#475569"/>
    <circle cx="800" cy="335" r="8" fill="#475569"/>
    <circle cx="800" cy="370" r="8" fill="#475569"/>
    <circle cx="800" cy="405" r="8" fill="#475569"/>
    <circle cx="800" cy="440" r="8" fill="#475569"/>
    <circle cx="800" cy="475" r="12" fill="#10b981" filter="url(#glow)"/>
    <circle cx="800" cy="510" r="8" fill="#475569"/>
  </g>
  <text x="800" y="540" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Digit '7' (Softmax)</text>

  <!-- Connecting Lines -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1">
    <line x1="509" y1="230" x2="640" y2="250"/>
    <line x1="509" y1="270" x2="640" y2="295"/>
    <line x1="509" y1="310" x2="640" y2="340"/>
    <line x1="509" y1="350" x2="640" y2="385"/>
    <line x1="509" y1="390" x2="640" y2="430"/>
    <line x1="509" y1="430" x2="640" y2="475"/>
    <line x1="660" y1="385" x2="790" y2="475" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="660" y1="430" x2="790" y2="475" stroke="#38bdf8" stroke-opacity="0.8" stroke-width="2"/>
    <line x1="660" y1="475" x2="790" y2="475" stroke="#10b981" stroke-opacity="0.9" stroke-width="2.5"/>
  </g>

  <!-- Right Card: Output Predictions -->
  <rect x="900" y="94" width="330" height="576" rx="20" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="930" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Softmax Confidence</text>
  <text x="930" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Top Prediction: Digit 7 (99.4%)</text>
  
  <!-- Prediction Bars -->
  <!-- 0 -->
  <text x="930" y="210" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">0</text>
  <rect x="955" y="198" width="230" height="14" rx="7" fill="#1e293b"/>
  <rect x="955" y="198" width="3" height="14" rx="7" fill="#38bdf8"/>
  <text x="1195" y="210" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">0.1%</text>

  <!-- 1 -->
  <text x="930" y="245" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">1</text>
  <rect x="955" y="233" width="230" height="14" rx="7" fill="#1e293b"/>
  <rect x="955" y="233" width="5" height="14" rx="7" fill="#38bdf8"/>
  <text x="1195" y="245" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">0.2%</text>

  <!-- 2 -->
  <text x="930" y="280" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">2</text>
  <rect x="955" y="268" width="230" height="14" rx="7" fill="#1e293b"/>
  <rect x="955" y="268" width="4" height="14" rx="7" fill="#38bdf8"/>
  <text x="1195" y="280" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">0.1%</text>

  <!-- 7 (Selected) -->
  <text x="930" y="455" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="800">7</text>
  <rect x="955" y="443" width="230" height="16" rx="8" fill="#1e293b"/>
  <rect x="955" y="443" width="215" height="16" rx="8" fill="url(#cyanBlue)"/>
  <text x="1175" y="456" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700">99.4%</text>

  <!-- Big Result Badge -->
  <rect x="930" y="520" width="270" height="110" rx="16" fill="#030712" stroke="#10b981" stroke-width="1.5"/>
  <text x="960" y="555" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">CONFIRMED CLASSIFICATION</text>
  <text x="960" y="605" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900">Digit: 7</text>
  <circle cx="1140" cy="575" r="24" fill="#10b981" fill-opacity="0.15"/>
  <path d="M 1130 575 L 1137 582 L 1152 567" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
</svg>
